name: pylon-test4
entrypoint: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
description: |
  PYLON - AI 기반 에너지 인텔리전스 시스템
  데이터센터 에너지 최적화 및 성과 관리 플랫폼
service_type: python-streamlit
properties:
- revision: master
  ingress:
    path: /pylon-test4
  image:
    # Python 3.11 이미지 사용 (로컬 환경과 일치)
    from: 'public.ecr.aws/docker/library/python:3.11-slim'
  # cronjob 필요 시 아래 부분 주석 해제
